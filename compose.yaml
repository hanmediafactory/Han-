services:
  han:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      TRUST_PROXY: '1'
      HAN_DB_PATH: /app/data/han.sqlite
      HAN_ALLOWED_ORIGINS: https://${HAN_DOMAIN}
      HAN_TIMEZONE: ${HAN_TIMEZONE:-Asia/Kolkata}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      HAN_FCM_ENABLED: ${HAN_FCM_ENABLED:-0}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      HAN_WEBHOOK_ALLOWED_ORIGINS: ${HAN_WEBHOOK_ALLOWED_ORIGINS:-}
    volumes:
      - han-data:/app/data
    expose:
      - '3001'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - internal

  https:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      HAN_DOMAIN: ${HAN_DOMAIN:?Set HAN_DOMAIN to your domain}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      han:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
    networks:
      - internal

  backups:
    build: .
    restart: unless-stopped
    command: ['node', 'server/backup-loop.mjs']
    environment:
      HAN_DB_PATH: /app/data/han.sqlite
      HAN_BACKUP_DIR: /app/backups
      HAN_BACKUP_RETENTION: '14'
      HAN_BACKUP_INTERVAL_SECONDS: '86400'
    volumes:
      - han-data:/app/data:ro
      - han-backups:/app/backups
    depends_on:
      han:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  han-data:
  caddy-data:
  caddy-config:
  han-backups:
