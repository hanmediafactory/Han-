services:
  - type: web
    name: han-workspace
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.18.0"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: HAN_DATABASE_URL
        sync: false
      - key: HAN_DATABASE_CA_CERT
        sync: false
      - key: HAN_ADMIN_BRIDGE_SECRET
        sync: false
      - key: HAN_DOMAIN
        sync: false
      - key: HAN_ALLOWED_ORIGINS
        sync: false
