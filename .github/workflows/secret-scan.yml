name: Secret scan
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan-current-files:
    name: Scan current source files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan the checked-out files with Gitleaks
        shell: bash
        run: |
          report="${RUNNER_TEMP}/gitleaks-report.json"
          touch "$report"
          if docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -v "$report:/report.json" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            dir --redact --report-format json --report-path /report.json /repo; then
            exit 0
          else
            result=$?
            echo "Gitleaks findings (location and rule only; matched text is withheld):"
            jq -r '.[] | "\(.File):\(.StartLine) rule=\(.RuleID)"' "$report"
            exit "$result"
          fi
