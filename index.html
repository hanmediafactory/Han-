<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-clean.png" />
    <link rel="shortcut icon" type="image/png" href="/logo-clean.png" />
    <link rel="apple-touch-icon" href="/logo-clean.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="HAN Media Factory — Workspace, Projects, Finances & Growth" />
    <meta property="og:title" content="HAN" />
    <meta property="og:description" content="HAN Media Factory Workspace" />
    <meta property="og:image" content="/logo-clean.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/logo-clean.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>HAN</title>
  </head>
  <body>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('han_theme') || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (!isDark) {
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
